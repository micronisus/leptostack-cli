---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: taiga-pre
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: keycloak-post
    - name: pgcluster
    - name: rabbitmq
    - name: forgejo-pre
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/taiga/pre
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: taiga-rabbitmq
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: taiga-pre
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/taiga/rabbitmq
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: taiga
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: taiga-pre
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/taiga
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config

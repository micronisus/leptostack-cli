---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hoppscotch-pre
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: pgcluster
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/hoppscotch/pre
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hoppscotch
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: hoppscotch-pre
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/hoppscotch
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config

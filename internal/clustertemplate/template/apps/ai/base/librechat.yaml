---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: librechat-pre
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-config
    - name: openbao-post
    - name: keycloak-post
    - name: apisix-internal
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/librechat/pre
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: librechat
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: librechat-pre
    - name: litellm
    - name: firecrawl
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/librechat
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config

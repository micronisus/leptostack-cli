# LeptoStack custom configuration -- DO NOT CHANGE THIS FILE! Add your cluster level settings as overlay patches
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: leptostack-config
  namespace: flux-system
data:
  cluster_name: local
  leptostack_domain: minikube.test
  leptostack_name: portal
  leptostack_acme_email: ""

  #### Hostnames
  # sso_hostname: portal-sso
  # che_hostname: portal-che
  # dashboard_hostname: portal-dashboard
  # db_hostname: portal-db
  # design_hostname: portal-design
  # git_hostname: portal-git
  # llm_hostname: portal-llm
  # registry_hostname: portal-registry
  # projects_hostname: portal-projects
  # objectstore_hostname: portal-objectstore

  #### Storage Sizes
  # pgcluster_storage_size: 10Gi
  # rustfs_storage_size: 10Gi
  # rustfs_log_storage_size: 1Gi
  # forgejo_storage_size: 10Gi
  # harbor_registry_storage_size: 10Gi
  # harbor_trivy_storage_size: 10Gi
  # openbao_storage_size: 10Gi
  # rabbitmq_storage_size: 10Gi
  # taiga_static_storage_size: 10Gi
  # taiga_media_storage_size: 10Gi

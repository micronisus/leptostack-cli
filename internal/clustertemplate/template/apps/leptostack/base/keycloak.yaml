---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-pre
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: pgcluster
    - name: keycloak-crd
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/keycloak/pre
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: keycloak-pre
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/keycloak
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-post
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: keycloak
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/keycloak/post
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
      kind: DefaultClientScopes
      current: >-
        status.conditions.exists(e, e.type == 'Synced' && e.status == 'True') &&
        status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: supabase-dbinit
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: pgcluster-pre
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/supabase/dbinit
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: supabase-pre
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: keycloak-pre
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/supabase/pre
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: supabase
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: supabase-pre
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/supabase
  prune: true
  wait: false
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: core-backend
  namespace: flux-system
spec:
  secretRef:
    name: registry-creds
  image: ghcr.io/leptostack/core-backend
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: core-backend-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: core-backend
  filterTags:
    pattern: '[a-f0-9]+-(?P<ts>[0-9]+)'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---

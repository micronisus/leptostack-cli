---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: module-core
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 30m
  dependsOn:
    - name: leptostack-operator
    - name: keycloak-post
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/modules/core
  prune: true
  wait: true
  postBuild:
    substitute:
      module_name: module-core
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: module-core-images
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: '{{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}'
    push:
      branch: main
  update:
    path: ./apps
    strategy: Setters

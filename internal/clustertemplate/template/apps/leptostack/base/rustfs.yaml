---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rustfs-pre
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: keycloak-post
    - name: openbao-post
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/rustfs/pre
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rustfs
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: rustfs-pre
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/rustfs
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rustfs-post
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: rustfs
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/rustfs/post
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: >-
        status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
    - apiVersion: s3.aws.m.upbound.io/v1beta1
      kind: Bucket
      current: >-
        status.conditions.exists(e, e.type == 'Synced' && e.status == 'True') &&
        status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
    - apiVersion: tf.m.upbound.io/v1beta1
      kind: Workspace
      current: >-
        status.conditions.exists(e, e.type == 'Synced' && e.status == 'True') &&
        status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: Bucket
      current: >-
        status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: valkey
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-config
    - name: openbao-post
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/valkey
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
  ignore:
    - paths:
        - /spec/users
      target:
        group: valkey.io
        kind: ValkeyCluster
        version: v1alpha1

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: example-

configurations:
  - naming-conf.yaml

resources:
  - ../../base

patches:
  - target:
      kind: ConfigMap
      name: leptostack-config
      namespace: flux-system
    path: leptostack-config.yaml
  - target:
      kind: Kustomization
      name: module-core
    path: module-core-images.yaml

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-keycloak-pre
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-pgcluster
    - name: keycloak-crd
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/keycloak/pre
  prune: true
  wait: true
  postBuild:
    substitute:
      cluster_name: infra
      sso_hostname: infra-sso
      objectstore_hostname: infra-objectstore
      objectstore_internal_hostname: infra-rustfs
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-keycloak
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-keycloak-pre
    - name: infra-apisix-post
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/keycloak
  prune: true
  wait: true
  postBuild:
    substitute:
      cluster_name: infra
      sso_hostname: infra-sso
      objectstore_hostname: infra-objectstore
      objectstore_internal_hostname: infra-rustfs
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-keycloak-post
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-keycloak
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/keycloak/post
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
      kind: DefaultClientScopes
      current: >-
        status.conditions.exists(e, e.type == 'Synced' && e.status == 'True') &&
        status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
    - apiVersion: k8s.keycloak.org/v2beta1
      kind: KeycloakRealmImport
      current: >-
        status.conditions.exists(e, e.type == 'Done' && e.status == 'True') &&
        !status.conditions.exists(e, e.type == 'HasErrors' && e.status == 'True')
  postBuild:
    substitute:
      cluster_name: infra
      sso_hostname: infra-sso
      objectstore_hostname: infra-objectstore
      objectstore_internal_hostname: infra-rustfs
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config

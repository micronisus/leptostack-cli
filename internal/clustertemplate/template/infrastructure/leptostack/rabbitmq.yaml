apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rabbitmq
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-config
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  serviceAccountName: kustomize-controller
  path: ./infrastructure/rabbitmq
  prune: false
  wait: true

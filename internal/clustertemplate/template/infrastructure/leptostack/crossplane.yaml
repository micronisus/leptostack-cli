apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane
  namespace: flux-system
spec:
  interval: 720m0s
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  serviceAccountName: kustomize-controller
  path: ./infrastructure/crossplane
  prune: false
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-post
  namespace: flux-system
spec:
  interval: 720m0s
  dependsOn:
    - name: crossplane
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  serviceAccountName: kustomize-controller
  path: ./infrastructure/crossplane/post
  prune: false
  wait: true
  timeout: 10m
  healthCheckExprs:
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      current: >-
        status.conditions.exists(e, e.type == 'Healthy' && e.status == 'True') &&
        status.conditions.exists(e, e.type == 'Installed' && e.status == 'True')
    - apiVersion: pkg.crossplane.io/v1
      kind: Function
      current: >-
        status.conditions.exists(e, e.type == 'Healthy' && e.status == 'True') &&
        status.conditions.exists(e, e.type == 'Installed' && e.status == 'True')

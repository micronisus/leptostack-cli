---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-pgcluster-pre
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-openbao-init
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/pgcluster/pre
  prune: true
  wait: true
  postBuild:
    substitute:
      cluster_name: infra
      sso_hostname: infra-sso
      objectstore_hostname: infra-objectstore
      objectstore_internal_hostname: infra-rustfs
      pgcluster_storage_size: 10Gi
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-pgcluster
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-openbao-post
    - name: infra-pgcluster-pre
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/pgcluster
  prune: true
  wait: true
  postBuild:
    substitute:
      cluster_name: infra
      sso_hostname: infra-sso
      objectstore_hostname: infra-objectstore
      objectstore_internal_hostname: infra-rustfs
      pgcluster_storage_size: 10Gi
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config

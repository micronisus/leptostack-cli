---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-openbao
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-config
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/openbao
  prune: true
  wait: true
  postBuild:
    substitute:
      cluster_name: infra
      sso_hostname: infra-sso
      objectstore_hostname: infra-objectstore
      objectstore_internal_hostname: infra-rustfs
      openbao_storage_size: 10Gi
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-openbao-init
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-openbao
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/openbao/init
  prune: true
  wait: true
  postBuild:
    substitute:
      cluster_name: infra
      sso_hostname: infra-sso
      objectstore_hostname: infra-objectstore
      objectstore_internal_hostname: infra-rustfs
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-openbao-post
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-openbao-init
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/openbao/post
  prune: true
  wait: true
  postBuild:
    substitute:
      cluster_name: infra
      sso_hostname: infra-sso
      objectstore_hostname: infra-objectstore
      objectstore_internal_hostname: infra-rustfs
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-openbao-oidc-client
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-openbao-post
    - name: infra-keycloak-post
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/openbao/oidc-client
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: >-
        status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
  postBuild:
    substitute:
      cluster_name: infra
      sso_hostname: infra-sso
      objectstore_hostname: infra-objectstore
      objectstore_internal_hostname: infra-rustfs
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-openbao-oidc
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: infra-openbao-oidc-client
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./leptostack/openbao/oidc
  prune: true
  wait: true
  postBuild:
    substitute:
      cluster_name: infra
      sso_hostname: infra-sso
      objectstore_hostname: infra-objectstore
      objectstore_internal_hostname: infra-rustfs
    substituteFrom:
      - kind: ConfigMap
        name: leptostack-config

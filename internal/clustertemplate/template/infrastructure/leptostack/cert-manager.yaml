apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 720m0s
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  serviceAccountName: kustomize-controller
  path: ./infrastructure/cert-manager
  prune: false
  wait: true
  timeout: 10m

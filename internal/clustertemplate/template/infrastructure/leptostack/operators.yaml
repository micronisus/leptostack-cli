apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: operators
  namespace: flux-system
spec:
  interval: 720m0s
  dependsOn:
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  serviceAccountName: kustomize-controller
  path: ./infrastructure/operators
  prune: false
  wait: true
  timeout: 10m

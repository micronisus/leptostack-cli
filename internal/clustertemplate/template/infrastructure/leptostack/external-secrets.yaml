apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 720m0s
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  serviceAccountName: kustomize-controller
  path: ./infrastructure/external-secrets
  prune: false
  wait: false
  timeout: 10m

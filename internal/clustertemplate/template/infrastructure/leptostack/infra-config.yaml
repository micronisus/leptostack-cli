apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-config
  namespace: flux-system
spec:
  interval: 720m0s
  timeout: 10m
  dependsOn:
    - name: cert-manager
    - name: trust-manager
    - name: external-secrets
    - name: crossplane
    - name: crossplane-post
    - name: operators
  sourceRef:
    kind: GitRepository
    name: leptostack-base
  path: ./infrastructure/config
  prune: false
  wait: true

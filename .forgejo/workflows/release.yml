name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Release
        run: bash scripts/release.sh
        env:
          # Forgejo injects GITHUB_TOKEN for the workflow; pass it under both
          # names so the shared release script can use the Gitea/Forgejo API.
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

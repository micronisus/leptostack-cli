name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format (semver vX.Y.Z)
        run: echo "${{ github.ref_name }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax check
        run: bash -n leptostack.sh

      - name: Shellcheck lint
        run: shellcheck -S warning leptostack.sh

      - name: Inject version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^SCRIPT_VERSION=\"dev\"/SCRIPT_VERSION=\"${VERSION}\"/" leptostack.sh

      - name: Verify version injection
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^SCRIPT_VERSION=\"${VERSION}\"" leptostack.sh

      - name: Compute checksum
        run: sha256sum leptostack.sh > leptostack.sh.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            leptostack.sh leptostack.sh.sha256 \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
